<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    />
    <title>Helm</title>
    <link rel="stylesheet" href="renderer.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <!-- Deliberately empty: traffic-light inset + drag region only. No
				     branding, no connection dot — daemon state lives in the sidebar
				     (waiting card when unreachable; silence when connected). -->
        <div class="topbar-left" aria-hidden="true"></div>
        <div id="tab-strip-region" class="topbar-right">
          <div class="tab-strip-controls">
            <div id="tabs"></div>
            <button
              id="new-tab"
              title="New terminal (&#8984;T)"
              aria-label="New terminal"
            >
              +
            </button>
          </div>
          <div
            id="topbar-drag-space"
            class="topbar-drag-space"
            aria-hidden="true"
          ></div>
          <div id="bg-root">
            <button
              id="bg-toggle"
              hidden
              title="Background terminals"
              aria-label="Background terminals"
              aria-haspopup="dialog"
              aria-expanded="false"
            >
              <!-- Heroicons “Arrow Down on Square Stack”, 16px solid (MIT). See THIRD_PARTY_NOTICES.md. -->
              <svg
                class="background-icon"
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="M7 1a.75.75 0 0 1 .75.75V6h-1.5V1.75A.75.75 0 0 1 7 1ZM6.25 6v2.94L5.03 7.72a.75.75 0 0 0-1.06 1.06l2.5 2.5a.75.75 0 0 0 1.06 0l2.5-2.5a.75.75 0 1 0-1.06-1.06L7.75 8.94V6H10a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2.25Z"
                ></path>
                <path
                  d="M4.268 14A2 2 0 0 0 6 15h6a2 2 0 0 0 2-2v-3a2 2 0 0 0-1-1.732V11a3 3 0 0 1-3 3H4.268Z"
                ></path>
              </svg>
              <span id="bg-current" class="bg-current" hidden></span>
              <span id="bg-count" class="bg-count">0</span>
            </button>
            <div
              id="bg-popover"
              class="menu-panel menu-end"
              hidden
              role="dialog"
              aria-label="Background terminals"
            >
              <div class="bg-header">Background terminals</div>
              <div id="bg-rows"></div>
            </div>
          </div>
        </div>
      </header>
      <div id="content">
        <aside id="left"></aside>
        <div id="divider" title="Drag to resize"></div>
        <main id="right">
          <div id="terms"></div>
          <div id="no-terms" hidden>
            <div class="no-terms-card">
              <div class="no-terms-title">No terminals open</div>
              <div class="no-terms-detail">
                Press <kbd>&#8984;T</kbd> or click + to open one.
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
