<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    />
    <title>Helm</title>
    <link rel="stylesheet" href="renderer.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <!-- Deliberately empty: traffic-light inset + drag region only. No
				     branding, no connection dot — daemon state lives in the sidebar
				     (waiting card when unreachable; silence when connected). -->
        <div class="topbar-left" aria-hidden="true"></div>
        <div class="topbar-right">
          <div class="tab-strip-controls">
            <div id="tabs"></div>
            <button
              id="new-tab"
              title="New terminal (&#8984;T)"
              aria-label="New terminal"
            >
              +
            </button>
          </div>
          <div
            id="topbar-drag-space"
            class="topbar-drag-space"
            aria-hidden="true"
          ></div>
          <div id="bg-root">
            <button
              id="bg-toggle"
              hidden
              title="Background terminals"
              aria-label="Background terminals"
              aria-haspopup="dialog"
              aria-expanded="false"
            >
              <svg
                class="layers-icon"
                width="14"
                height="14"
                viewBox="0 0 14 14"
                fill="none"
                stroke="currentColor"
                stroke-width="1"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M7 1.5 12.5 4.5 7 7.5 1.5 4.5 7 1.5Z"
                  vector-effect="non-scaling-stroke"
                ></path>
                <path
                  d="m1.5 7.5 5.5 3 5.5-3M1.5 10.5l5.5 3 5.5-3"
                  vector-effect="non-scaling-stroke"
                ></path>
              </svg>
              <span id="bg-current" class="bg-current" hidden></span>
              <span id="bg-count" class="bg-count">0</span>
            </button>
            <div
              id="bg-popover"
              class="menu-panel menu-end"
              hidden
              role="dialog"
              aria-label="Background terminals"
            >
              <div class="bg-header">Background terminals</div>
              <div id="bg-rows"></div>
            </div>
          </div>
        </div>
      </header>
      <div id="content">
        <aside id="left"></aside>
        <div id="divider" title="Drag to resize"></div>
        <main id="right">
          <div id="terms"></div>
          <div id="no-terms" hidden>
            <div class="no-terms-card">
              <div class="no-terms-title">No terminals open</div>
              <div class="no-terms-detail">
                Press <kbd>&#8984;T</kbd> or click + to open one.
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
