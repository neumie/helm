<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    />
    <title>Helm</title>
    <link rel="stylesheet" href="renderer.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <!-- Traffic-light reserve + persistent task toggle; only isolated
             whitespace becomes native-draggable. Daemon state stays in Tasks. -->
        <div class="topbar-left"></div>
        <div id="tab-strip-region" class="topbar-right">
          <div class="tab-strip-controls">
            <div id="tabs"></div>
            <button
              id="new-tab"
              title="New terminal (&#8984;T)"
              aria-label="New terminal"
            >
              +
            </button>
          </div>
          <div
            id="topbar-drag-space"
            class="topbar-drag-space"
            aria-hidden="true"
          ></div>
          <div id="bg-root">
            <button
              id="bg-toggle"
              hidden
              title="Background terminals"
              aria-label="Background terminals"
              aria-haspopup="dialog"
              aria-expanded="false"
            >
              <!-- Heroicons “Arrow Down on Square Stack”, 24px outline at stroke 2 (MIT). See THIRD_PARTY_NOTICES.md. -->
              <svg
                class="background-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path
                  d="M7.5 7.5H6.75C5.50736 7.5 4.5 8.50736 4.5 9.75V17.25C4.5 18.4926 5.50736 19.5 6.75 19.5H14.25C15.4926 19.5 16.5 18.4926 16.5 17.25V9.75C16.5 8.50736 15.4926 7.5 14.25 7.5H13.5M7.5 11.25L10.5 14.25M10.5 14.25L13.5 11.25M10.5 14.25L10.5 1.5M16.5 10.5H17.25C18.4926 10.5 19.5 11.5074 19.5 12.75V20.25C19.5 21.4926 18.4926 22.5 17.25 22.5H9.75C8.50736 22.5 7.5 21.4926 7.5 20.25V19.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
              <span id="bg-current" class="bg-current" hidden></span>
              <span id="bg-count" class="bg-count">0</span>
            </button>
            <div
              id="bg-popover"
              class="menu-panel menu-end"
              hidden
              role="dialog"
              aria-label="Background terminals"
            >
              <div class="bg-header">Background terminals</div>
              <div id="bg-rows"></div>
            </div>
          </div>
        </div>
      </header>
      <div id="content">
        <aside id="left"></aside>
        <div id="divider" title="Drag to resize"></div>
        <main id="right">
          <div id="terms"></div>
          <!-- Okena Claude agent dock; agent-dock-layout.ts mounts it only when
               the preload exposes window.helm.agentDock. -->
          <section id="agent-dock" hidden></section>
          <div id="no-terms" hidden>
            <div class="no-terms-card">
              <div class="no-terms-title">No terminal open</div>
              <div class="no-terms-detail">
                Press <kbd>&#8984;T</kbd> to start one.
              </div>
              <div class="no-terms-action"></div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
