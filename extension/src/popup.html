<!DOCTYPE html>
<html>
<head>
	<style>
		/* The Helm token values this page paints, under their plain names (docs/design-system.md §3.28, §9 ruling 103),
		   generated from packages/helm-ui/tokens; tests/design-tokens.test.ts holds the block fresh. */
		:root {
			/* tokens:begin (generated by npm run tokens:write from packages/helm-ui/tokens; edit the source, never this) */
			--pane: #141517;
			--hairline: rgba(255, 255, 255, 0.07);
			--hairline-strong: rgba(255, 255, 255, 0.16);
			--fill-subtle: rgba(255, 255, 255, 0.05);
			--text-0: #ececee;
			--text-1: #9a9ea6;
			--text-2: #7f848d;
			--accent: #4c9aff;
			--accent-fill: #1e6ff5;
			--success: #4ec98a;
			--danger: #f46e70;
			--font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
			/* tokens:end */
		}
		body {
			width: 280px;
			padding: 16px;
			margin: 0;
			font-family: var(--font-ui);
			background: var(--pane);
			color: var(--text-0);
			color-scheme: dark;
			letter-spacing: -0.01em;
			-webkit-font-smoothing: antialiased;
		}
		h1 {
			font-size: 13px;
			font-weight: 600;
			color: var(--accent);
			margin: 0 0 12px;
		}
		label {
			display: block;
			font-size: 12px;
			font-weight: 500;
			color: var(--text-1);
			margin-bottom: 4px;
		}
		input[type="text"] {
			width: 100%;
			height: 28px;
			padding: 0 10px;
			background: var(--fill-subtle);
			border: 1px solid var(--hairline);
			border-radius: 6px;
			color: var(--text-0);
			font-family: inherit;
			font-size: 12px;
			outline: none;
			box-sizing: border-box;
		}
		input[type="text"]::placeholder { color: var(--text-1); }
		input[type="text"]:hover,
		input[type="text"][data-force-state~="hover"] { border-color: var(--hairline-strong); }
		input[type="text"]:focus { border-color: var(--accent); }
		.status {
			margin-top: 8px;
			min-height: 18px;
			font-size: 12px;
			line-height: 18px;
		}
		.status--ok { color: var(--success); }
		.status--error { color: var(--danger); }
		.models { margin-top: 12px; }
		.models .group {
			margin: 12px 0 4px;
			font-size: 12px;
			font-weight: 600;
			color: var(--text-1);
		}
		.models .row {
			display: flex;
			align-items: center;
			gap: 8px;
			margin: 0;
			padding: 4px 0;
			font-size: 12px;
			font-weight: 400;
			color: var(--text-0);
		}
		.models .row input {
			margin: 0;
			accent-color: var(--accent-fill);
		}
	</style>
</head>
<body>
	<h1>Helm</h1>
	<label for="url">Server URL</label>
	<input type="text" id="url" placeholder="http://localhost:7474" />
	<div class="status" id="status"></div>
	<div class="models" id="models" hidden>
		<label>Favorite models (quick-switch chips)</label>
		<div id="model-list"></div>
	</div>
	<script src="popup.js"></script>
</body>
</html>
